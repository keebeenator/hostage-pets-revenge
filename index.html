<style>

}

<div id="app">
 <h1>Hostage Pet's Revenge</h1>
 <div id="main">

   <div id="btns"><button id="bSound" class="sec">Sound: off</button><span id="best" style="align-self:center;font-size:11px;color:#a99bbd"></span><button id="bGo" class="pri">Run!</button></div>
  </div>
 </div>
</div>
<div id="end"><div class="box"><h2>YOU WON!</h2><div id="endNote" style="margin:8px 0 14px;line-height:1.9"></div><button id="bAgain" class="pri">Play again</button></div></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const C=$('scene'),X=C.getContext('2d');X.imageSmoothingEnabled=false;
const AV=$('ava'),AX=AV.getContext('2d');
const Q=new URLSearchParams(location.search),DEMO=Q.get('demo');
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const DUR=[3,4,6,8,10,13,16,20,25,30];
const reqRate=lv=>3+(lv-1)*0.2;           // taps/s needed to hold speed: 3.0 .. 4.8
const PER_TAP=0.16;
let level=Math.max(1,Math.min(10,+Q.get('level')||1)), best=+LS.get('pr_best',0)||0;
let state='intro', t=0, timeLeft=0, energy=0, taps=[], wheelA=0, legT=0, anim=0, failT=0, anvil=null, pancake=false, stars=[], sweat=0, low=0;
let sound=false, actx=null;
// ---------- messages ----------
const INTRO=[
 "WELCOME TO THE WHEEL, BANDIT. RUN.",
 "KEEP RUNNING, BANDIT.",
 "MY TURN TO HOLD THE KEYS.",
 "FASTER. I HAVE A CLIPBOARD.",
 "REMEMBER THE CAGE? I DO.",
 "NO SNACK BREAKS. HOSTAGE RULES.",
 "YOUR FEDORA IS SWEATING.",
 "I TIMED THIS. TWICE.",
 "ALMOST FREE... OR ARE YOU?",
 "FINAL LAP. THIRTY SECONDS. SMILE."];
const WIN=["NOT BAD. AGAIN.","HUFF HUFF? CUTE. NEXT.","YOU LIVE. FOR NOW.","THE WHEEL APPROVES.","ADEQUATE, BANDIT.","STILL BREATHING? HMM.","I'M TAKING NOTES.","YOUR LEGS ARE NOODLES.","ONE MORE. HEH."];
const FAIL=["YOU STOPPED. TSK TSK.","WHEEL: 1  BANDIT: 0","SEE YOU IN DIZZYLAND.","GET UP. TRY AGAIN.","LAZY RACCOON SPOTTED."];
const ANVIL="YOU RAN ALL 10 LEVELS... BUT I ORDERED AN ANVIL. NOW WE'RE EVEN. LOVE, SNUFFY.";
// ---------- ransom note ----------
function seeded(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>((h=Math.imul(h^(h>>>13),1274126177)>>>0)/4294967296);}
function ransom(el,text){el.innerHTML='';const rnd=seeded(text);
 const BG=['#f3e7a1','#f4b6c8','#bfe3c0','#ffffff','#bcd7f0','#1d1d1d','#f6f1e4','#ffd166','#d8c4f0'];
 const FF=['Georgia,serif','"Courier New",monospace','Impact,Arial Black,sans-serif','"Times New Roman",serif','Verdana,sans-serif','"Comic Sans MS",cursive'];
 for(const word of text.split(' ')){const w=document.createElement('span');w.className='rw';
  for(const ch of word){const s=document.createElement('span');s.className='rl';const bg=BG[rnd()*BG.length|0];s.textContent=rnd()<0.5?ch.toLowerCase():ch;
   s.style.background=bg;s.style.color=bg==='#1d1d1d'?'#fff':(rnd()<0.3?'#c41e3a':'#111');s.style.fontFamily=FF[rnd()*FF.length|0];
   s.style.transform='rotate('+((rnd()-.5)*12).toFixed(1)+'deg) translateY('+((rnd()-.5)*3).toFixed(1)+'px)';s.style.fontSize=(0.85+rnd()*0.35).toFixed(2)+'em';w.appendChild(s);}
  el.appendChild(w);}
}
// ---------- sound ----------
function beep(f,d,type,vol,slide){if(!sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=type||'square';o.frequency.value=f;
 if(slide)o.frequency.exponentialRampToValueAtTime(slide,actx.currentTime+d);g.gain.value=vol||0.05;g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}
$('bSound').onclick=e=>{sound=!sound;$('bSound').textContent='Sound: '+(sound?'on':'off');if(sound)beep(660,0.1);};
// ---------- pixel helpers ----------
let G=X;function r(x,y,w,h,c){G.fillStyle=c;G.fillRect(Math.round(x),Math.round(y),w,h);}
function line(x0,y0,x1,y1,c){x0|=0;y0|=0;x1|=0;y1|=0;const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;G.fillStyle=c;
 for(let i=0;i<300;i++){G.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
function ring(cx,cy,R,c,th){G.fillStyle=c;for(let a=0;a<Math.PI*2;a+=0.5/R){G.fillRect(Math.round(cx+Math.cos(a)*R-th/2),Math.round(cy+Math.sin(a)*R-th/2),th,th);}}
// ---------- sprites ----------
const PAL={fur:'#9a9aa8',furD:'#6c6c7a',furL:'#d9d9e2',mask:'#17141c',suit:'#47305f',suitL:'#5f4682',suitD:'#2f1f40',hat:'#7a4e2e',hatD:'#4e3019',band:'#2c1a0e',tie:'#d6263c',shoe:'#0d0b10'};
// raccoon facing right, origin = top-left of 22x30 box
function raccoon(ox,oy,f,mode){ // mode: run|gasp|x|ghost
  const P=PAL;
  // tail (striped)
  const tw=mode==='run'?Math.sin(f*Math.PI)*1:0;
  [[0,18],[ -2,15],[-3,12],[-4,9]].forEach(([dx,dy],i)=>r(ox+dx+1,oy+dy+tw,3,3,i%2?P.mask:P.fur));r(ox-3,oy+7,3,2,P.mask);
  // legs
  const a=mode==='run'?(f%2?1:-1):0;
  r(ox+7+a*2,oy+24,3,5,P.suitD);r(ox+12-a*2,oy+24,3,5,P.suitD);
  r(ox+6+a*2,oy+28,5,2,P.shoe);r(ox+11-a*2,oy+28,5,2,P.shoe);
  // body/suit
  r(ox+5,oy+15,12,10,P.suit);r(ox+5,oy+15,2,10,P.suitD);r(ox+15,oy+16,2,8,P.suitL);
  r(ox+9,oy+15,4,6,'#e9e3f2');r(ox+10,oy+17,2,5,P.suitD);r(ox+8,oy+15,6,2,P.tie);r(ox+10,oy+15,2,2,'#8e1424');
  r(ox+7,oy+16,2,4,P.suitL);r(ox+13,oy+16,2,4,P.suitL); // lapels
  r(ox+11,oy+21,1,1,'#ffd166');r(ox+11,oy+23,1,1,'#ffd166'); // buttons
  // arms
  if(mode==='run'){r(ox+14+a,oy+17,3,6,P.suitD);r(ox+15+a,oy+22,3,2,P.fur);r(ox+4-a,oy+17,3,5,P.suitD);r(ox+3-a,oy+21,3,2,P.fur);}
  else{r(ox+16,oy+17,3,7,P.suitD);r(ox+16,oy+23,3,2,P.fur);r(ox+3,oy+17,3,7,P.suitD);r(ox+3,oy+23,3,2,P.fur);}
  // head
  r(ox+4,oy+5,14,10,P.fur);r(ox+4,oy+5,1,10,P.furD);r(ox+5,oy+14,12,1,P.furD);
  r(ox+12,oy+10,8,4,P.furL);r(ox+19,oy+10,2,2,P.mask);           // muzzle + nose
  r(ox+5,oy+7,14,3,P.mask);                                       // eye mask
  if(mode==='x'){[[8,7],[14,7]].forEach(([ex,ey])=>{r(ox+ex,oy+ey,1,1,'#fff');r(ox+ex+2,oy+ey,1,1,'#fff');r(ox+ex+1,oy+ey+1,1,1,'#fff');r(ox+ex,oy+ey+2,1,1,'#fff');r(ox+ex+2,oy+ey+2,1,1,'#fff');});}
  else{r(ox+8,oy+8,2,1,'#fff');r(ox+14,oy+8,2,1,'#fff');r(ox+9,oy+8,1,1,P.mask);r(ox+15,oy+8,1,1,P.mask);}
  if(mode==='gasp'||mode==='x'){r(ox+15,oy+13,3,2,'#3a0d18');r(ox+16,oy+14,2,2,'#ff7aa2');} else r(ox+15,oy+13,3,1,P.furD);
  // ears
  r(ox+5,oy+3,3,3,P.fur);r(ox+14,oy+3,3,3,P.fur);r(ox+6,oy+4,1,1,P.mask);r(ox+15,oy+4,1,1,P.mask);
  // fedora
  r(ox+2,oy+4,19,2,P.hatD);r(ox+6,oy-1,11,5,P.hat);r(ox+6,oy+2,11,1,P.band);r(ox+7,oy-1,3,1,'#9a6a42');
}
function pet(ox,oy,f,mood){ // 22x20 box; mood: smug|laugh
  const b=mood==='laugh'?(f%2):0; oy-=b;
  const W='#f6efe2',S='#e3d6c2',K='#f39ab4',D='#1a1418';
  // ears
  r(ox+3,oy+1,5,5,W);r(ox+4,oy+2,3,3,K);r(ox+14,oy+1,5,5,W);r(ox+15,oy+2,3,3,K);
  // fluffy body
  r(ox+3,oy+5,16,13,W);r(ox+2,oy+7,18,9,W);r(ox+1,oy+9,20,5,W);r(ox+4,oy+17,14,2,S);r(ox+2,oy+14,2,2,S);r(ox+18,oy+14,2,2,S);
  r(ox+6,oy+4,2,1,W);r(ox+12,oy+4,3,1,W);r(ox+9,oy+3,2,2,W); // tuft
  // smug half-lidded eyes
  r(ox+6,oy+9,3,2,D);r(ox+13,oy+9,3,2,D);r(ox+6,oy+9,3,1,S);r(ox+13,oy+9,3,1,S);r(ox+8,oy+10,1,1,'#fff');r(ox+15,oy+10,1,1,'#fff');
  r(ox+5,oy+12,2,1,K);r(ox+15,oy+12,2,1,K);                 // cheeks
  r(ox+10,oy+11,2,1,K);                                       // nose
  if(mood==='laugh'){r(ox+9,oy+13,4,2,D);r(ox+10,oy+14,2,1,K);} else {r(ox+9,oy+13,3,1,D);r(ox+12,oy+12,1,1,D);} // smirk
  // feet
  r(ox+5,oy+18,3,2,K);r(ox+14,oy+18,3,2,K);
  // clipboard + pencil
  r(ox+15,oy+10,7,9,'#8a5a2b');r(ox+16,oy+11,5,7,'#f4f1e6');r(ox+17,oy+10,3,1,'#c9c9d1');
  for(let i=0;i<3;i++)r(ox+17,oy+13+i*2,3,1,'#8f8aa0');r(ox+17,oy+12,1,1,'#d6263c');
  r(ox+13,oy+13,3,3,W); // paw holding it
}
function ghostOf(drawFn,w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');const old=G;G=g;drawFn();G=old;
  g.globalCompositeOperation='source-atop';g.fillStyle='rgba(235,240,255,.85)';g.fillRect(0,0,w,h);return c;}
const OFF=document.createElement('canvas');OFF.width=30;OFF.height=36;
function raccoonCanvas(mode){const g=OFF.getContext('2d');g.clearRect(0,0,30,36);const old=G;G=g;raccoon(5,4,0,mode);G=old;return OFF;}
// ---------- scene ----------
const WHX=66,WHY=66,WHR=27, FLOOR=96;
function background(){
  // bricks
  r(0,0,160,FLOOR,'#18131f');
  for(let row=0;row*6<FLOOR;row++){const off=row%2?6:0;for(let x=-12;x<160;x+=12){const hsh=((x*7+row*13)%5+5)%5;
    r(x+off+1,row*6+1,11,5,['#2b2340','#302746','#271f39','#2e2443','#251d35'][hsh]);r(x+off+1,row*6+1,11,1,'#3a3054');}}
  // light cone (row fills, crisp)
  for(let y=14;y<FLOOR;y++){const w=(y-14)*1.15+4;r(80-w/2,y,w,1,'rgba(255,236,170,0.075)');}
  r(80,0,1,10,'#0b080f');r(78,9,5,3,'#3a3340');r(78,12,5,4,'#f7d46a');r(79,13,2,2,'#fff6c8');
  // floor
  r(0,FLOOR,160,24,'#5a3a22');r(0,FLOOR,160,1,'#7d5534');
  for(let y=FLOOR+6;y<120;y+=6)r(0,y,160,1,'#3d2615');
  for(let i=0;i<10;i++){const y=FLOOR+1+((i%4)*6),x=(i*37)%160;r(x,y,1,5,'#3d2615');}
  // vignette
  for(let i=0;i<6;i++){r(i,0,1,120,'rgba(0,0,0,.18)');r(159-i,0,1,120,'rgba(0,0,0,.18)');}
}
function wheel(){
  // stand
  line(WHX-14,WHY+20,WHX-20,FLOOR,'#5c5f6a');line(WHX+14,WHY+20,WHX+20,FLOOR,'#5c5f6a');line(WHX-13,WHY+20,WHX-19,FLOOR,'#8b8f9a');line(WHX+13,WHY+20,WHX+19,FLOOR,'#8b8f9a');
  r(WHX-22,FLOOR-1,6,2,'#3a3c44');r(WHX+17,FLOOR-1,6,2,'#3a3c44');
  // back rim + bars
  ring(WHX,WHY,WHR,'#6f7380',2);
  for(let i=0;i<24;i++){const a=wheelA+i*Math.PI/12;r(Math.round(WHX+Math.cos(a)*(WHR-1)),Math.round(WHY+Math.sin(a)*(WHR-1)),1,1,'#c7cbd6');}
  for(let i=0;i<6;i++){const a=wheelA+i*Math.PI/3;line(WHX,WHY,WHX+Math.cos(a)*(WHR-2),WHY+Math.sin(a)*(WHR-2),'#8b8f9a');}
  r(WHX-2,WHY-2,4,4,'#c7cbd6');r(WHX-1,WHY-1,2,2,'#5c5f6a');
}
function wheelFront(){ring(WHX,WHY,WHR+1,'#aeb3bf',1);ring(WHX,WHY,WHR-3,'rgba(174,179,191,.45)',1);}
function star(x,y,c){r(x,y-1,1,3,c);r(x-1,y,3,1,c);}
function anvilSpr(x,y){r(x,y,20,4,'#3b3e47');r(x-5,y,6,2,'#3b3e47');r(x+4,y+4,12,4,'#2c2e35');r(x+2,y+8,16,3,'#3b3e47');r(x,y,20,1,'#6d717e');r(x+1,y+2,2,1,'#8a8e9a');}
function render(){
  G=X;X.clearRect(0,0,160,120);background();
  const rx=WHX-11, ry=WHY+WHR-32; // raccoon in wheel bottom
  wheel();
  const fr=Math.floor(legT)%2;
  if(state==='run'||state==='intro'||(state==='win'&&!pancake&&!anvil)||DEMO==='run'){
    raccoon(rx,ry+(state==='run'&&fr?-1:0),fr,state==='win'?'gasp':'run');
    if(state==='win'){if((t*4|0)%2)r(rx+20,ry+3,1,2,'#7fc8ff');r(rx+22,ry+6,1,2,'#7fc8ff');}
    if(state==='run'&&energy>0.6){for(let i=0;i<3;i++)r(rx-8-((t*60+i*7)%10),ry+8+i*6,4,1,'rgba(255,255,255,.4)');}
    if(state==='run'&&energy<0.3){r(rx+21,ry+2,1,2,'#7fc8ff');}
  }
  wheelFront();
  if(state==='fail'){
    // raccoon tumbled out: lying dizzy on floor to the right of the wheel, then ghost rises
    const ft=t-failT; const lx=98, ly=FLOOR-12;
    const c=raccoonCanvas('x');X.save();X.translate(lx+18,ly+14);X.rotate(Math.PI/2);X.drawImage(c,-15,-18);X.restore();
    for(let i=0;i<3;i++){const a=t*5+i*2.1;star(Math.round(lx+16+Math.cos(a)*9),Math.round(ly-1+Math.sin(a)*3),i%2?'#ffd166':'#fff6c8');}
    if(ft>0.9){const gy=ly-6-Math.min(50,(ft-0.9)*22);const gc=ghostOf(()=>raccoon(5,4,0,'x'),30,36);X.globalAlpha=0.55+0.15*Math.sin(t*6);X.drawImage(gc,lx+2+Math.round(Math.sin(t*3)*2),Math.round(gy-20));X.globalAlpha=1;
      ring(lx+20+Math.round(Math.sin(t*3)*2),Math.round(gy-22),5,'#ffd166',1);}
  }
  if(anvil){const ax=rx-3;
    if(!pancake){const sh=Math.max(2,Math.round(20*anvil.y/(ry)));r(ax+10-sh/2,FLOOR-1,sh,2,'rgba(0,0,0,.45)');raccoon(rx,ry,0,'gasp');anvilSpr(ax,anvil.y);
      if((t*8|0)%2){r(ax+8,anvil.y-6,1,3,'#fff');r(ax+12,anvil.y-9,1,3,'#fff');}}
    else{const c=raccoonCanvas('x');X.drawImage(c,0,0,30,36,rx-8,ry+26,40,6);anvilSpr(ax,ry+15);
      for(let i=0;i<4;i++){const a=t*4+i*1.6;star(Math.round(ax+10+Math.cos(a)*16),Math.round(ry+12+Math.sin(a)*3),i%2?'#ffd166':'#fff6c8');}}
  }
  // pet (captor) on the right
  pet(128,FLOOR-20,Math.floor(t*6),(state==='fail'||pancake)?'laugh':'smug');
}
function drawAvatar(){const old=G;G=AX;AX.clearRect(0,0,24,24);AX.fillStyle='#120d18';AX.fillRect(0,0,24,24);pet(1,3,0,'smug');G=old;}
// ---------- flow ----------
function setNote(txt){ransom($('note'),txt);}
function ui(){
  $('lv').textContent='LV '+level+'/10';$('best').textContent='BEST: LV '+best;
  $('tm').textContent=(state==='run'?Math.max(0,timeLeft):state==='intro'?DUR[level-1]:0).toFixed(1)+'s';
  $('meter').style.width=Math.round(Math.max(0,Math.min(1,energy))*100)+'%';
  $('meterReq').style.left='calc('+Math.round((reqRate(level)/7)*100)+'% - 1px)';
  $('meterLbl').textContent=(rate().toFixed(1))+' / '+reqRate(level).toFixed(1)+' taps/s';
  $('tapHint').style.display=state==='run'?'block':'none';
}
function rate(){const now=performance.now();taps=taps.filter(x=>now-x<1200);return taps.length/1.2;}
function intro(){state='intro';energy=0.7;pancake=false;anvil=null;timeLeft=DUR[level-1];setNote(INTRO[level-1]);$('bGo').textContent='Run! ('+DUR[level-1]+'s)';$('bGo').style.display='';ui();}
function start(){state='run';energy=0.75;taps=[];timeLeft=DUR[level-1];low=0;$('bGo').style.display='none';beep(880,0.08);}
function win(){state='win';best=Math.max(best,level);LS.set('pr_best',best);beep(523,0.1);setTimeout(()=>beep(784,0.15),110);
  if(level===10){$('bGo').style.display='none';setNote('HUFF... HUFF... I DID IT!');setTimeout(dropAnvil,1100);return;}
  setNote(WIN[(level-1)%WIN.length]);$('bGo').textContent='Next level';$('bGo').style.display='';}
function fail(){state='fail';failT=t;beep(300,0.5,'sawtooth',0.05,90);setNote(FAIL[(Math.random()*FAIL.length)|0]);$('bGo').textContent='Try again';$('bGo').style.display='';}
function dropAnvil(){anvil={y:-14,v:0};beep(1800,0.9,'sine',0.04,300);}
function endScreen(){ransom($('endNote'),ANVIL);setNote('SPLAT. OOPS. HEH HEH.');$('end').style.display='flex';}
$('bGo').addEventListener('click',e=>{e.stopPropagation();
  if(state==='intro')start(); else if(state==='win'){level=Math.min(10,level+1);intro();} else if(state==='fail')intro();});
$('bAgain').addEventListener('click',()=>{$('end').style.display='none';level=1;intro();});
function tap(e){ if(e.target.closest&&e.target.closest('button'))return; e.preventDefault();
  if(state==='run'){taps.push(performance.now());energy=Math.min(1,energy+PER_TAP);legT+=0.5;beep(1200+Math.random()*200,0.02,'square',0.02);} }
document.addEventListener('pointerdown',tap,{passive:false});
document.addEventListener('touchstart',e=>{if(!(e.target.closest&&e.target.closest('button')))e.preventDefault();},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault());document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.code==='Space'){tap({target:document.body,preventDefault(){}});e.preventDefault();}});
// ---------- loop ----------
let last=performance.now();
function update(dt){
  t+=dt;
  if(state==='run'){
    const req=reqRate(level); energy-=req*PER_TAP*dt; timeLeft-=dt;
    const rt=rate(); low = rt<req*0.5 ? low+dt : 0;
    if(energy<=0||low>1.0){energy=Math.max(0,energy);fail();}
    else if(timeLeft<=0){timeLeft=0;win();}
  }
  const spin= state==='run'? (0.6+energy*5) : state==='win'?0.3:0;
  wheelA+=spin*dt; legT+=spin*dt*1.4;
  if(anvil&&!pancake){anvil.v+=420*dt;anvil.y+=anvil.v*dt;const ry=WHY+WHR-32;if(anvil.y>=ry+15){pancake=true;beep(140,0.35,'square',0.08,60);setTimeout(endScreen,1000);}}
}
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);render();ui();requestAnimationFrame(frame);}
window.__pet={get state(){return state},get level(){return level},get energy(){return energy},get best(){return best},get pancake(){return pancake},setLevel(n){level=n;intro();},tap:()=>tap({target:document.body,preventDefault(){}})};
drawAvatar();intro();
if(DEMO==='run'){level=3;intro();start();energy=0.85;timeLeft=4.2;for(let i=0;i<5;i++)taps.push(performance.now()-i*200);window.__freezeDemo=1;}
if(DEMO==='fail'){level=4;intro();start();fail();t=2.2;failT=0;}
if(DEMO==='anvil'){level=10;intro();start();state='win';pancake=true;anvil={y:0,v:0};t=1;endScreen();}
if(window.__freezeDemo){const u=update;update=function(dt){t+=dt;wheelA+=3*dt;legT+=6*dt;};}
requestAnimationFrame(frame);
})();
</script></body></html>
